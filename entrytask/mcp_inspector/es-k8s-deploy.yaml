apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: elasticsearch:8.9.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"  # 限制内存，避免 Kind 资源不足
          resources:
            limits:
              memory: 1Gi
              cpu: 1
---
# NodePort Service：暴露 ES 到宿主机
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-nodeport
  namespace: default
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      nodePort: 30920  # 宿主机访问端口（30000-32767 范围）